<script type="module">

const fixedViews={
 'South Grant overhead':[[590,1100,1310],[590,0,1300]],

 'Fulton overhead':[[-2010,1100,-660],[-2010,0,-650]],
 'Park overhead':[[650,1900,700],[650,0,690]],
 'Pier overhead':[[1860,1300,-1060],[1850,0,-1065]],
 'Pier entrance':[[1770,160,-825],[1575,12,-1060]],
 'South Dock':[[2130,65,-945],[1880,10,-1040]],
 'Maggie Daley':[[1000,340,170],[745,0,-80]],

for(const label of Object.keys(fixedViews)){const o=document.createElement('option');o.value='fixed:'+label;o.textContent=label;document.querySelector('#place').append(o);}
for(const id of ['overview','grantpark','navypier','relativity','ondean']){const o=document.createElement('option');o.value='benchmark:'+id;o.textContent='Benchmark: '+id;document.querySelector('#place').append(o);}
const ready = setInterval(async () => { if (app()) { clearInterval(ready); out.textContent = 'Ready'; const geo=await import('/docs/js/geo.js');for(const L of geo.LANDMARKS)if(!document.querySelector(`#place option[value="${L.id}"]`)){const o=document.createElement('option');o.value=L.id;o.textContent=L.name;document.querySelector('#place').append(o);} const explorer=await import('/docs/js/explorer.js');for(const [key,d]of Object.entries(explorer.DISTRICTS)){const o=document.createElement('option');o.value='district:'+key;o.textContent=d.name;document.querySelector('#place').append(o);} } }, 200);
document.querySelector('#desktop').onclick = () => { frame.width = 1200; frame.height = 740; };
document.querySelector('#phone').onclick = () => { frame.width = 390; frame.height = 844; };
document.querySelector('#build').onchange=e=>{frame.src=e.target.value;out.textContent='Loading selected build…';};
document.querySelector('#place').onchange = async (e) => {
  const a = app(), geo = await import('/docs/js/geo.js'), tour = await import('/docs/js/tour.js');
  a.flyer.cancel();
  let view;
  if(e.target.value.startsWith('fixed:')){const THREE=await import('three'),v=fixedViews[e.target.value.slice(6)];view={pos:new THREE.Vector3(...v[0]),target:new THREE.Vector3(...v[1])};}
  else if(e.target.value.startsWith('benchmark:')){const id=e.target.value.slice(10),oldGeo=await import('/.cache/detail-baseline/docs/js/geo.js'),oldTour=await import('/.cache/detail-baseline/docs/js/tour.js');const fixed=new oldTour.Flyer(a.camera,a.controls,{});view=id==='overview'?{pos:oldTour.OVERVIEW.pos,target:oldTour.OVERVIEW.target}:fixed.viewFor(oldGeo.LANDMARKS.find(l=>l.id===id));a.perf.level=0;}
  else if(e.target.value.startsWith('district:')) {const {DISTRICTS}=await import('/docs/js/explorer.js');const THREE=await import('three');const d=DISTRICTS[e.target.value.slice(9)];view={pos:new THREE.Vector3(...d.pos),target:new THREE.Vector3(...d.target)};}
  else view = e.target.value === 'overview' ? { pos: tour.overviewPos(a.camera.aspect), target: tour.OVERVIEW.target }
    : a.flyer.viewFor(geo.LANDMARKS.find((l) => l.id === e.target.value));
  a.camera.position.copy(view.pos); a.controls.target.copy(view.target); a.controls.update();
};
document.querySelector('#time').onchange = (e) => {
  const slider = frame.contentDocument.querySelector('#time'); slider.value = Number(e.target.value) * 1000;
  slider.dispatchEvent(new Event('input', { bubbles: true }));
};
document.querySelector('#check').onclick = () => {
  const a = app(), meshes = [], particles = [], faults = [];
  a.scene.traverse((o) => {
    if (o.isMesh) meshes.push(o);
    if (o.isPoints) particles.push({name:o.name || 'unnamed',count:o.geometry.attributes.position.count});
    if (o.geometry?.attributes.position) {
      const array = o.geometry.attributes.position.array;
      if (!array.every(Number.isFinite)) faults.push(o.name || 'geometry');
    }
    if (o.instanceMatrix && !o.instanceMatrix.array.every(Number.isFinite)) faults.push(o.name || 'instances');
  });
  out.textContent = JSON.stringify({finiteGeometry:faults.length === 0,faults,particles,
    cityCastsShadow:a.scene.getObjectByName('city').castShadow, shadowSize:a.lighting.sun.shadow.mapSize.x,
    cachedShadows:!a.renderer.shadowMap.autoUpdate,meshes:meshes.length,
    activeCasters:meshes.filter((m)=>m.castShadow).length,canvas:[a.renderer.domElement.width,a.renderer.domElement.height],
    horizontalOverflow:frame.contentDocument.documentElement.scrollWidth > Number(frame.width),
    documentMode:frame.contentDocument.compatMode, tier:a.perf.level, render:a.ctx.renderStats,
    measuredBuildings:a.ctx.measuredBuildings.length,roads:a.ctx.roads.length,life:a.ctx.life.stats,walkRoutes:a.ctx.life.walks.length,
    camera:a.camera.position.toArray(),roadTraffic:a.ctx.life.cars.slice(0,5).map(c=>[c.edge.id,c.d]),
    facadeMaterials:meshes.filter(m=>m.name.startsWith('footprints-')).slice(0,2).map(m=>({normal:[...m.geometry.attributes.normal.array.slice(0,12)],style:m.material.userData.facade.uStyle.value}))},null,2);
};
document.querySelector('#offices').onclick=async()=>{
  const a=app(),THREE=await import('three'),{LANDMARKS}=await import('/docs/js/geo.js'),{TOUR,Flyer,OVERVIEW}=await import('/docs/js/tour.js'),{pointInRing}=await import('/docs/js/city-data.js');
  const cross=(o,p,q)=>(p[0]-o[0])*(q[1]-o[1])-(p[1]-o[1])*(q[0]-o[0]);
  const hull=points=>{points.sort((p,q)=>p[0]-q[0]||p[1]-q[1]);const half=ps=>{const h=[];for(const p of ps){while(h.length>1&&cross(h.at(-2),h.at(-1),p)<=0)h.pop();h.push(p);}return h;};const lo=half(points),hi=half([...points].reverse());return [...lo.slice(0,-1),...hi.slice(0,-1)];};
  const intersects=(p,q)=>p.some(v=>pointInRing(...v,q))||q.some(v=>pointInRing(...v,p))||p.some((v,i)=>q.some((w,j)=>cross(v,p[(i+1)%p.length],w)*cross(v,p[(i+1)%p.length],q[(j+1)%q.length])<-.0001&&cross(w,q[(j+1)%q.length],v)*cross(w,q[(j+1)%q.length],p[(i+1)%p.length])<-.0001));
  out.textContent=JSON.stringify(LANDMARKS.filter(l=>['relativity','ondean'].includes(l.id)).map(l=>{
    const object=a.scene.getObjectByName(l.id),bounds=new THREE.Box3().setFromObject(object),view=a.flyer.viewFor(l);
    const points=[],v=new THREE.Vector3();object.traverse(o=>{const p=o.geometry?.attributes.position;if(p)for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).applyMatrix4(o.matrixWorld);points.push([v.x,v.z]);}});const outline=hull(points);
    const overlaps=a.ctx.measuredBuildings.filter(b=>bounds.max.x>b.x0&&bounds.min.x<b.x1&&bounds.max.z>b.z0&&bounds.min.z<b.z1&&intersects(outline,b.rings[0])).map(b=>b.id);
    const roadOverlaps=a.ctx.roads.filter(r=>r.path.some((p,i)=>{if(!i)return false;const q=r.path[i-1],w=r.width/2;if(Math.max(p[0],q[0])+w<bounds.min.x||Math.min(p[0],q[0])-w>bounds.max.x||Math.max(p[2],q[2])+w<bounds.min.z||Math.min(p[2],q[2])-w>bounds.max.z)return false;const dx=p[0]-q[0],dz=p[2]-q[2],n=Math.hypot(dx,dz);if(n<.01)return false;const nx=-dz/n*w,nz=dx/n*w;return intersects(outline,[[q[0]+nx,q[2]+nz],[p[0]+nx,p[2]+nz],[p[0]-nx,p[2]-nz],[q[0]-nx,q[2]-nz]]);})).map(r=>r.name);
    const cameraInside=a.ctx.collisionBuildings.filter(b=>view.pos.x>b.x0&&view.pos.x<b.x1&&view.pos.z>b.z0&&view.pos.z<b.z1&&view.pos.y<b.h).map(b=>b.id);
    const camera=a.camera.clone(),controls={target:OVERVIEW.target.clone()},flyer=new Flyer(camera,controls,a.ctx);camera.position.copy(OVERVIEW.pos);flyer.reducedMotion=false;flyer.flyTo(view.pos,view.target);let flightCollisions=0;while(flyer.anim){flyer.update(1/60);if(a.ctx.collisionBuildings.some(b=>camera.position.x>b.x0&&camera.position.x<b.x1&&camera.position.z>b.z0&&camera.position.z<b.z1&&camera.position.y<b.h+.6))flightCollisions++;}
    flyer.reducedMotion=true;flyer.flyTo(OVERVIEW.pos,OVERVIEW.target);const reducedMotionImmediate=!flyer.anim&&camera.position.equals(OVERVIEW.pos);
    return {id:l.id,bounds:[bounds.min.toArray(),bounds.max.toArray()],overlaps,roadOverlaps,cameraInside,flightCollisions,reducedMotionImmediate,collisionRegistered:a.ctx.collisionBuildings.some(b=>b.id===l.id),genericFootprintRemoved:!a.ctx.measuredBuildings.some(b=>l.footprintIds.includes(b.id)),inGuidedTour:TOUR.includes(l.id),view:view.pos.toArray()};
  }),null,2);
};
document.querySelector('#waterfront').onclick=async()=>{
 const a=app(),{inPoly}=await import('/docs/js/waterfront-data.js'),{atDistance}=await import('/docs/js/movement.js');
 const faults=[];for(const r of a.ctx.life.walks.filter(r=>r.id&&a.ctx.waterfront.paths.some(p=>p.id===r.id)))for(let d=0;d<r.length;d+=2){const p=atDistance(r,d);if(p.y<2&&!a.ctx.waterfront.land.some(poly=>inPoly(p.x,p.z,poly))&&!a.ctx.waterfront.paths.some(path=>path.id===r.id&&path.kind==='bridge'))faults.push(r.id);}
 let newCasters=0,lights=0;a.scene.getObjectByName('waterfront').traverse(o=>{if(o.castShadow)newCasters++;if(o.isLight)lights++;});a.scene.getObjectByName('navy-pier-architecture').traverse(o=>{if(o.castShadow)newCasters++;if(o.isLight)lights++;});
 out.textContent=JSON.stringify({walkerBudget:a.ctx.life.people.filter(p=>!p.cyclist).length,cyclistBudget:a.ctx.life.people.filter(p=>p.cyclist).length,vehicles:a.ctx.life.cars.length,registeredRoutes:a.ctx.routes.size,waterfront:a.ctx.waterfrontStats,routeWaterFaults:[...new Set(faults)],newCasters,newLights:lights,piers:a.ctx.waterfront.anchors.filter(a=>['glass','hall','hotel','ballroom'].includes(a.kind)).map(a=>a.id)},null,2);
};
document.querySelector('#benchmark').onclick=async()=>{
  app().perf.level=0;
  out.textContent='Warming matching tier for 3 seconds…';await new Promise(r=>setTimeout(r,3000));
  const a=app(),times=[],calls=[],start=performance.now();let last=start;const before=a.ctx.life.stats.steps;
  out.textContent='Measuring 8 seconds; keep this tab in the foreground…';
  const sample=now=>{times.push(now-last);last=now;calls.push(a.ctx.renderStats.calls);if(now-start<8000){requestAnimationFrame(sample);return;}
    times.sort((x,y)=>x-y);out.textContent=JSON.stringify({build:document.querySelector('#build').value,view:document.querySelector('#place').value,lighting:document.querySelector('#time').value,frames:times.length,medianMs:times[Math.floor(times.length*.5)],p95Ms:times[Math.floor(times.length*.95)],maxCalls:Math.max(...calls),triangles:a.ctx.renderStats.triangles,geometries:a.renderer.info.memory.geometries,textures:a.renderer.info.memory.textures,lifeSteps:a.ctx.life.stats.steps-before,visible:!document.hidden,focused:document.hasFocus(),gpu:a.perf.gpu,tier:a.perf.level,life:a.ctx.life.stats},null,2);
  };requestAnimationFrame(sample);
};
document.querySelector('#motion').onclick=async()=>{
  const a=app(),{atDistance}=await import('/docs/js/movement.js');
  const old=a.ctx.life.cars.map(c=>[c.edge.id,c.d]);a.ctx.life.audit(90);
  let moved=0,invalid=0,boatLand=0;for(const [i,c]of a.ctx.life.cars.entries()){if(c.edge.id!==old[i][0]||Math.abs(c.d-old[i][1])>2)moved++;const p=atDistance(c.edge,c.d);if(![p.x,p.y,p.z,c.d].every(Number.isFinite)||c.d<0||c.d>c.edge.length+.1)invalid++;}
  for(let d=0;d<a.ctx.life.boatRoute.length;d+=5){const p=atDistance(a.ctx.life.boatRoute,d);if(!a.ctx.isRiver(p.x,p.z))boatLand++;}
  const paused=a.ctx.life.paused;a.ctx.life.paused=true;const t=a.ctx.life.time;a.ctx.life.update(.1);const pauseWorks=t===a.ctx.life.time;a.ctx.life.paused=paused;
  out.textContent=JSON.stringify({movedAfter90Seconds:moved,totalCars:old.length,invalidRoutes:invalid,boatSamplesOnLand:boatLand,pauseWorks,life:a.ctx.life.stats},null,2);
};

document.querySelector('#sites').onclick=async()=>{
 const a=app(),{siteVolumes}=await import('/docs/js/site-data.js'),{inPoly}=await import('/docs/js/waterfront-data.js');
 let casters=0,lights=0;a.scene.getObjectByName('site-details').traverse(o=>{if(o.castShadow)casters++;if(o.isLight)lights++;});
 const collisions=[],flights=[];const {DISTRICTS}=await import('/docs/js/explorer.js');
 for(const [id,d]of Object.entries(DISTRICTS))for(const b of a.ctx.collisionBuildings)if(d.pos[0]>b.x0&&d.pos[0]<b.x1&&d.pos[2]>b.z0&&d.pos[2]<b.z1&&d.pos[1]<b.h)collisions.push([id,b.id]);
 const THREE=await import('three'),{Flyer,OVERVIEW}=await import('/docs/js/tour.js');
 for(const [id,d]of Object.entries(DISTRICTS)){
  const camera=a.camera.clone(),controls={target:OVERVIEW.target.clone()},flyer=new Flyer(camera,controls,a.ctx);camera.position.copy(OVERVIEW.pos);flyer.reducedMotion=false;flyer.flyTo(new THREE.Vector3(...d.pos),new THREE.Vector3(...d.target));let hits=0;
  while(flyer.anim){flyer.update(1/60);if(a.ctx.collisionBuildings.some(b=>camera.position.x>b.x0&&camera.position.x<b.x1&&camera.position.z>b.z0&&camera.position.z<b.z1&&camera.position.y<b.h+.6))hits++;}
  if(hits)flights.push({id,collisions:hits});
 }
 out.textContent=JSON.stringify({stats:a.ctx.siteStats,agora:a.scene.getObjectByName('agora-106-figures').count,casters,lights,districtCameraCollisions:collisions,districtFlightCollisions:flights,siteVolumes:siteVolumes(a.ctx.sites).length},null,2);
};
document.querySelector('#triple').onclick=async()=>{
 const samples=[],a=app();a.perf.level=0;
 for(let run=0;run<3;run++){
  out.textContent='Warming sample '+(run+1)+' / 3';await new Promise(r=>setTimeout(r,3000));
  out.textContent='Measuring sample '+(run+1)+' / 3';const times=[],calls=[],start=performance.now();let last=start;
  await new Promise(resolve=>{const tick=now=>{times.push(now-last);last=now;calls.push(a.ctx.renderStats.calls);if(now-start<8000)requestAnimationFrame(tick);else resolve();};requestAnimationFrame(tick);});
  times.sort((x,y)=>x-y);samples.push({median:times[Math.floor(times.length*.5)],p95:times[Math.floor(times.length*.95)],frames:times.length,calls:Math.max(...calls)});
 }
 out.textContent=JSON.stringify({build:document.querySelector('#build').value,view:document.querySelector('#place').value,lighting:document.querySelector('#time').value,samples,tier:a.perf.level,size:[frame.width,frame.height],foreground:!document.hidden,focused:document.hasFocus(),gpu:a.perf.gpu},null,2);
};

const suiteResults=[];
document.querySelector('#suite').onclick=async()=>{
 const THREE=await import('three'),oldTour=await import('/.cache/detail-baseline/docs/js/tour.js'),oldGeo=await import('/.cache/detail-baseline/docs/js/geo.js');
 const cases=[['skyline-day','overview',0],['skyline-night','overview',1],['south-grant','South Grant bench',0],['willis-base','Willis base bench',0],['relativity','relativity',0],['ondean','ondean',0],['fulton','Fulton bench',0]];
 const build=document.querySelector('#build').value;
 for(let i=suiteResults.length-1;i>=0;i--)if(suiteResults[i].build===build)suiteResults.splice(i,1);
 for(const [label,id,time]of cases){
  const a=app(),flyer=new oldTour.Flyer(a.camera,a.controls,{});a.perf.level=0;a.flyer.cancel();
  const v=id==='overview'?{pos:oldTour.OVERVIEW.pos,target:oldTour.OVERVIEW.target}:fixedViews[id]?{pos:new THREE.Vector3(...fixedViews[id][0]),target:new THREE.Vector3(...fixedViews[id][1])}:flyer.viewFor(oldGeo.LANDMARKS.find(l=>l.id===id));
  a.camera.position.copy(v.pos);a.controls.target.copy(v.target);a.controls.update();a.lighting.set(time);document.querySelector('#time').value=String(time);
  frame.width=1200;frame.height=740;const samples=[];
  // Settle loader, sun/environment, reflection and material compilation first.
  out.textContent='Settling '+label+' '+build;await new Promise(r=>setTimeout(r,5000));
  for(let run=0;run<3;run++){
   out.textContent=JSON.stringify({status:'Warming',case:label,build,sample:run+1,completed:suiteResults},null,2);await new Promise(r=>setTimeout(r,3000));
   const times=[],calls=[],start=performance.now();let last=start;
   out.textContent=JSON.stringify({status:'Measuring',case:label,build,sample:run+1,completed:suiteResults},null,2);
   await new Promise(resolve=>{const tick=now=>{times.push(now-last);last=now;calls.push(a.ctx.renderStats.calls);if(now-start<8000)requestAnimationFrame(tick);else resolve();};requestAnimationFrame(tick);});
   times.sort((x,y)=>x-y);samples.push({median:+times[Math.floor(times.length*.5)].toFixed(3),p95:+times[Math.floor(times.length*.95)].toFixed(3),frames:times.length,calls:Math.max(...calls),foreground:!document.hidden,focused:document.hasFocus()});
  }
  suiteResults.push({case:label,build,siteCount:a.ctx.siteStats?.sites||0,samples,tier:a.perf.level,size:[frame.width,frame.height],gpu:a.perf.gpu});
 }
 out.textContent=JSON.stringify({status:'Complete',results:suiteResults},null,2);
};
document.querySelector('#capture').onclick = async () => {
  const a = app(); frame.width = 1200; frame.height = 630;
  const tour = await import('/docs/js/tour.js'); a.flyer.cancel();
  a.camera.position.copy(tour.OVERVIEW.pos); a.controls.target.copy(tour.OVERVIEW.target); a.controls.update();
  a.lighting.set(0.6); a.lighting.update(1,a.controls.target);
  a.perf.level = 0;
  a.camera.aspect = 1200/630; a.camera.updateProjectionMatrix(); a.renderer.setPixelRatio(1); a.renderer.setSize(1200,630,false);
  a.composer.setPixelRatio(1); a.composer.setSize(1200,630);
  // Let the reflection's camera matrix catch up to the new view and aspect.
  // Capturing immediately can reuse a reflection projected from the previous view.
  for(let i=0;i<16;i++)await new Promise(resolve=>frame.contentWindow.requestAnimationFrame(resolve));
  frame.contentWindow.requestAnimationFrame(async () => {
    a.composer.render();
    const blob = await new Promise((resolve) => a.renderer.domElement.toBlob(resolve,'image/png'));
    const res = await fetch('/__preview',{method:'POST',body:blob});
    out.textContent = res.ok ? 'Saved preview.png (1200 × 630)' : await res.text();
  });
};
